name: Android
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pokedex-debug
          path: app/build/outputs/apk/debug/app-debug.apk
  device-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            ./gradlew connectedDebugAndroidTest
            adb shell am start -n com.example.poke_android/.MainActivity
            sleep 30
            mkdir -p screenshots
            adb exec-out screencap -p > screenshots/pokedex.png
            adb shell uiautomator dump /sdcard/pokedex-window.xml
            adb pull /sdcard/pokedex-window.xml screenshots/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            screenshots/
